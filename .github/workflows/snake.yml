name: Generate Contribution Snake

on:
  # 每天自动更新一次
  # GitHub Actions 的 cron 使用 UTC 时间
  # UTC 00:00 = 日本时间 09:00 = 中国时间 08:00
  schedule:
    - cron: "0 0 * * *"

  # 允许在 Actions 页面手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 生成亮色和暗色两种贪吃蛇
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23A855F7&color_dots=%23F3E8FF,%23DDD6FE,%23C084FC,%23A855F7,%237E22CE
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23E879F9&color_dots=%2318101F,%233B185F,%237E22CE,%23C026D3,%23E879F9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 将生成的 SVG 发布到 output 分支
      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
