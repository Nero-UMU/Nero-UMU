name: Update GitHub Profile

on:
  # 每天自动更新一次
  # UTC 00:00 = 日本时间 09:00 = 中国时间 08:00
  schedule:
    - cron: "0 0 * * *"

  # 允许从 Actions 页面手动运行
  workflow_dispatch:

# 允许工作流向 main 和 output 分支写入文件
permissions:
  contents: write

# 避免手动运行和定时运行同时执行
concurrency:
  group: update-github-profile
  cancel-in-progress: true

jobs:
  # ========================================================
  # 生成 GitHub Profile Summary Cards
  # ========================================================
  summary-cards:
    name: Generate Profile Summary Cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # 需要在仓库 Secrets 中创建这个变量
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

        with:
          # 自动读取当前仓库所有者，即 Nero-UMU
          USERNAME: ${{ github.repository_owner }}

          # 将生成的卡片提交到 main 分支
          BRANCH_NAME: "main"

          # 北京时区 UTC+8
          UTC_OFFSET: 8

          # 不排除任何语言
          EXCLUDE: ""

          # 自动提交生成的 SVG 文件
          AUTO_PUSH: true

          # 只生成紫粉风格的 radical 主题
          THEME: "radical"

          # 保留加载动画
          ANIMATION: "load"

          # 动画持续时间，单位为秒
          DURATION: "3"

          # Profile Details 卡片显示的名称
          NAME: "NeroUMU"

  # ========================================================
  # 生成紫粉渐变贡献墙贪吃蛇
  # ========================================================
  snake:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-snake.svg?color_snake=%23A855F7&color_dots=%23F3E8FF,%23DDD6FE,%23C084FC,%23A855F7,%237E22CE
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23E879F9&color_dots=%2318101F,%233B185F,%237E22CE,%23C026D3,%23E879F9

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
