name: Update GitHub Profile

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-profile
  cancel-in-progress: true

jobs:
  summary-cards:
    name: Generate Profile Summary Cards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}

        with:
          USERNAME: ${{ github.repository_owner }}

          BRANCH_NAME: "main"

          UTC_OFFSET: 8

          EXCLUDE: ""

          AUTO_PUSH: true

          THEME: "radical"

          ANIMATION: "load"

          DURATION: "3"

          NAME: "NeroUMU"

  snake:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-snake.svg?color_snake=%23A855F7&color_dots=%23F3E8FF,%23DDD6FE,%23C084FC,%23A855F7,%237E22CE
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23E879F9&color_dots=%2318101F,%233B185F,%237E22CE,%23C026D3,%23E879F9

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
